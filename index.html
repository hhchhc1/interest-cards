<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>抖音兴趣卡 · 作品集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0f0c29 0%, #1a1a2e 45%, #16213e 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .head { text-align: center; margin-bottom: 32px; }
  .head h1 { font-size: 26px; letter-spacing: 2px; }
  .head p { margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.55); letter-spacing: 1px; }
  .list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    border-radius: 18px;
    text-decoration: none;
    color: #fff;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(12px);
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
  }
  a.card:hover { transform: translateY(-3px); background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); }
  a.card:active { transform: scale(.98); }
  .icon { font-size: 30px; width: 54px; height: 54px; flex: 0 0 54px; display: flex; align-items: center; justify-content: center; border-radius: 15px; }
  .i1 { background: linear-gradient(135deg,#ff6b6b,#ee5a6f); }
  .i2 { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }
  .i3 { background: linear-gradient(135deg,#4facfe,#00f2fe); }
  .i4 { background: linear-gradient(135deg,#43e97b,#38f9d7); }
  .txt h2 { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
  .txt p { font-size: 12px; color: rgba(255,255,255,.55); line-height: 1.5; }
  .foot { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="head">
    <h1>抖音兴趣卡 · 作品集</h1>
    <p>AI 创变者计划 · 上线挑战赛</p>
  </div>
  <div class="list">
    <a class="card" href="./01-moqi/">
      <div class="icon i1">💞</div>
      <div class="txt">
        <h2>默契大挑战</h2>
        <p>出题给朋友答，测测你们的默契度</p>
      </div>
    </a>
    <a class="card" href="./02-personality/">
      <div class="icon i2">🔮</div>
      <div class="txt">
        <h2>一分钟人格测试</h2>
        <p>5 道题，看出你的隐藏人格</p>
      </div>
    </a>
    <a class="card" href="./03-dream/">
      <div class="icon i3">🌙</div>
      <div class="txt">
        <h2>AI 梦境画廊</h2>
        <p>你昨晚的梦，值一幅画</p>
      </div>
    </a>
    <a class="card" href="./04-facts/">
      <div class="icon i4">💡</div>
      <div class="txt">
        <h2>冷知识探索器</h2>
        <p>翻牌探索 20 条反直觉冷知识</p>
      </div>
    </a>
  </div>
  <div class="foot">© 2026 hhchhc1</div>
</body>
</html>
